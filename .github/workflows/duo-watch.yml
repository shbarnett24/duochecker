name: Duo watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: duo-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
        run: python3 duo_check.py
      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "duo-bot"
            git config user.email "duo-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
